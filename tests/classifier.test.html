<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>분류기 테스트 · 세종 로컬 해결소(가칭)</title>
  <style>
    body { margin: 0; padding: 20px; color: #191f28; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; word-break: keep-all; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    #summary { margin: 12px 0 20px; font-size: 18px; font-weight: 700; }
    .wrap { overflow-x: auto; }
    table { width: 100%; min-width: 760px; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e5e8eb; text-align: left; vertical-align: top; }
    th { background: #f5f6f8; font-size: 13px; }
    .pass { font-weight: 700; }
    .fail { color: #b91c1c; font-weight: 700; }
    tr.is-fail td { background: #fef2f2; }
    .muted { color: #6b7684; }
  </style>
</head>
<body>
  <h1>분류기 테스트</h1>
  <p class="muted">문장의 기대 유형과 1위 유형을 비교합니다. 업종 보정이 섞이지 않게 업종은 '기타'로 둡니다.</p>
  <p id="summary" role="status">계산 중이에요.</p>
  <div class="wrap">
    <table>
      <thead>
        <tr><th>#</th><th>문장</th><th>기대 유형</th><th>결과 1위</th><th>결과 2위</th><th>걸린 키워드</th><th>판정</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script type="module">
    import { classify } from '../js/classifier.js';

    const PASS_TARGET = 16;
    const CASES = [
      ['인스타 홍보를 하고 싶은데 사진이 별로예요', 'promo'],
      ['네이버 지도에 저희 가게가 잘 안 나와요', 'promo'],
      ['리뷰가 너무 적어서 어떻게 늘릴지 고민이에요', 'promo'],
      ['가격을 올려야 할지 모르겠어요', 'menu'],
      ['원가가 올라서 남는 게 없어요', 'menu'],
      ['신메뉴를 넣고 싶은데 뭐가 잘 팔릴지 모르겠어요', 'menu'],
      ['재고가 자꾸 남아서 버려요', 'ops'],
      ['혼자 하다 보니 너무 바빠서 쉴 시간이 없어요', 'ops'],
      ['알바 구하기가 힘들고 근무표 짜는 게 일이에요', 'ops'],
      ['예약 전화가 너무 많아요', 'booking'],
      ['키오스크를 들여놓을지 고민돼요', 'booking'],
      ['손님이 온라인으로 주문할 수 있는 페이지가 있었으면 해요', 'booking'],
      ['간판이 오래돼서 바꾸고 싶어요', 'design'],
      ['메뉴판을 좀 더 예쁘게 만들고 싶어요', 'design'],
      ['가게 소개 영상을 찍어 보고 싶어요', 'design'],
      ['단골이 줄어든 이유를 알고 싶어요', 'customer'],
      ['주변에 비슷한 가게가 많이 생겨서 경쟁이 심해요', 'customer'],
      ['요즘 장사가 어떻게 돌아가는 건지 잘 모르겠어요', 'customer'],
      ['임대료가 밀려서 대출을 알아보고 있어요', 'funding'],
      ['부가세 신고를 어떻게 하는지 모르겠어요', 'funding'],
    ];

    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (ch) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
    ));

    const config = await fetch('../data/categories.json').then((response) => response.json());
    const nameOf = (id) => config.categories.find((category) => category.id === id).name;

    const results = CASES.map(([text, expected]) => {
      const result = classify({ text, industry: '기타', diag: [null, null, null, null] }, config);
      return { text, expected, result, pass: result.top[0].id === expected };
    });

    document.getElementById('rows').innerHTML = results.map(({ text, expected, result, pass }, index) => {
      const [first, second] = result.top;
      const terms = result.hits.map((hit) => hit.term).join(', ');
      return `<tr class="${pass ? '' : 'is-fail'}">
        <td>${index + 1}</td>
        <td>${escapeHtml(text)}</td>
        <td>${escapeHtml(nameOf(expected))}</td>
        <td>${escapeHtml(first.name)} (${first.score}점)${result.isDefault ? ' <span class="muted">기본값</span>' : ''}</td>
        <td>${second ? `${escapeHtml(second.name)} (${second.score}점)` : '<span class="muted">없음</span>'}</td>
        <td>${terms ? escapeHtml(terms) : '<span class="muted">없음</span>'}</td>
        <td class="${pass ? 'pass' : 'fail'}">${pass ? '통과' : '실패'}</td>
      </tr>`;
    }).join('');

    const passed = results.filter((item) => item.pass).length;
    document.getElementById('summary').textContent =
      `${CASES.length}문장 중 ${passed}개 통과 · 완료 기준 ${PASS_TARGET}개 이상 ${passed >= PASS_TARGET ? '충족' : '미달'}`;
  </script>
</body>
</html>
