<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세종 로컬 해결소 · 1분 체험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#22252B; --mut:#5B6170; --line:#E3E6EC; --bg:#FFFFFF; --soft:#F5F7FA;
    --teal:#0F7F7A; --teal-l:#39ADAA; --mint:#DDF4F2;
    --pur:#6A4DE8; --pur-l:#EEEAFE;
    --coral:#C9472A; --coral-l:#FFE9E2; --coral-m:#FF8A6B;
    --sky:#62AEFF; --sky-l:#E6F2FF; --yel:#FFD84D;
    --disp:"Jua","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:"Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; cursor:pointer; }
  button:focus-visible, textarea:focus-visible, a:focus-visible { outline:3px solid var(--sky); outline-offset:2px; }
  .disp { font-family:var(--disp); font-weight:400; letter-spacing:-0.3px; }
  .ic { display:block; flex-shrink:0; }
  .top { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.95); height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:6px; font-family:var(--disp); font-size:19px; }
  .brand .gomi { margin:-6px -2px -6px -6px; }
  .tag { font-size:13px; font-weight:700; color:var(--mut); background:var(--soft); border-radius:999px; padding:4px 10px; }
  main { padding:18px 18px 150px; max-width:520px; margin:0 auto; }
  /* sticker */
  .stk { border:2px solid var(--ink); border-radius:18px; background:#fff; box-shadow:4px 4px 0 var(--ink); }
  .btn { appearance:none; width:100%; min-height:58px; border:2px solid var(--ink); border-radius:16px; background:var(--teal); color:#fff; font-family:var(--disp); font-size:21px; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:4px 4px 0 var(--yel), 4px 4px 0 2px var(--ink); transition:transform .08s, box-shadow .08s; }
  .btn:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--yel), 1px 1px 0 2px var(--ink); }
  .btn.coral { background:var(--coral); }
  .btn.white { background:#fff; color:var(--ink); }
  /* landing */
  .hero { position:relative; background:var(--mint); border:2px solid var(--ink); border-radius:24px; padding:18px 16px 16px; overflow:hidden; margin:6px 0 22px; }
  .hero .spk { position:absolute; color:var(--yel); }
  .bubble { position:relative; display:inline-block; background:#fff; border:2px solid var(--ink); border-radius:14px; padding:8px 12px; font-family:var(--disp); font-size:17px; margin:0 0 4px 92px; }
  .bubble::after { content:""; position:absolute; left:-9px; bottom:10px; width:14px; height:14px; background:#fff; border-left:2px solid var(--ink); border-bottom:2px solid var(--ink); transform:rotate(45deg); }
  .hero-gomi { position:absolute; left:8px; top:6px; }
  .tri { position:relative; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:34px; }
  .tri svg.link { position:absolute; left:16%; right:16%; top:30px; width:68%; height:20px; }
  .node { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
  .node .b { width:62px; height:62px; border-radius:50%; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; background:#fff; }
  .node b { font-size:14px; }
  .node span { font-size:13px; color:var(--mut); line-height:1.35; }
  h1.big { font-size:33px; line-height:1.28; margin:0 0 10px; }
  .hl { background:linear-gradient(transparent 62%, var(--yel) 62%); padding:0 2px; }
  .lede { font-size:16px; line-height:1.65; color:#3A3F4B; margin:0 0 22px; }
  .fine { font-size:13px; color:var(--mut); text-align:center; margin:12px 0 0; }
  .more { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:18px; }
  .more a { display:flex; align-items:center; justify-content:center; gap:6px; min-height:48px; border:2px solid var(--ink); border-radius:14px; color:var(--ink); text-decoration:none; font-weight:700; font-size:15px; background:#fff; }
  /* progress */
  .prog { position:relative; height:34px; margin:2px 56px 14px 16px; }
  .prog .track { position:absolute; left:0; right:0; top:22px; border-top:3px dashed #C9CFD8; }
  .prog .fill { position:absolute; left:0; top:22px; border-top:3px solid var(--teal); transition:width .3s; }
  .prog .me { position:absolute; top:0; transform:translateX(-50%); transition:left .3s; }
  .prog .lab { position:absolute; right:-52px; top:12px; font-size:13px; font-weight:700; color:var(--mut); }
  .trail { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }
  .trail button { appearance:none; display:flex; align-items:center; gap:6px; min-height:44px; padding:0 12px; border:2px solid var(--ink); border-radius:999px; background:#fff; font-size:14px; font-weight:700; }
  .trail button .ic { color:var(--mut); }
  .q { font-size:28px; line-height:1.3; margin:0 0 16px; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .tile { appearance:none; position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:12px; min-height:112px; padding:14px; border:2px solid var(--ink); border-radius:18px; background:#fff; text-align:left; box-shadow:3px 3px 0 var(--ink); transition:transform .1s, background .1s; }
  .tile .ib { width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; border:2px solid var(--ink); }
  .tile b { font-size:17px; line-height:1.3; }
  .tile small { display:block; font-size:13px; color:var(--mut); font-weight:500; margin-top:3px; line-height:1.4; }
  .tile.wide { grid-column:1 / span 2; flex-direction:row; align-items:center; min-height:72px; }
  .tile.on { background:var(--mint); transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .tile .ok { position:absolute; right:10px; top:10px; width:28px; height:28px; border-radius:50%; background:var(--teal); color:#fff; display:none; align-items:center; justify-content:center; border:2px solid var(--ink); }
  .tile.on .ok { display:flex; }
  .list { display:flex; flex-direction:column; gap:12px; }
  .list .tile { flex-direction:row; align-items:center; min-height:76px; }
  .ask { display:flex; align-items:flex-end; gap:6px; margin:0 0 12px; }
  .ask .bubble { margin:0 0 30px 0; font-size:16px; }
  .ask .bubble::after { left:auto; right:-9px; transform:rotate(-135deg); }
  textarea { width:100%; min-height:110px; border:2px solid var(--ink); border-radius:16px; padding:14px; font:inherit; font-size:17px; line-height:1.55; resize:none; background:#fff; }
  textarea::placeholder { color:#7B8190; }
  .exh { font-size:14px; font-weight:700; color:var(--mut); margin:16px 0 8px; }
  .chips { display:flex; flex-direction:column; gap:8px; }
  .chip { appearance:none; text-align:left; border:2px solid var(--ink); background:var(--sky-l); border-radius:16px 16px 16px 4px; padding:11px 14px; font-size:15px; min-height:48px; }
  .err { color:#B42318; font-weight:700; font-size:15px; margin:10px 0 0; }
  .dock { position:fixed; left:0; right:0; bottom:0; padding:12px 18px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(to top,#fff 72%,rgba(255,255,255,0)); }
  .dock .btn { max-width:484px; margin:0 auto; }
  /* analyzing */
  .ana { text-align:center; padding-top:20px; }
  .ana .gomi { animation:bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-8px); } }
  .ana h2 { font-size:27px; margin:10px 0 18px; }
  .steps { display:inline-flex; flex-direction:column; gap:10px; text-align:left; }
  .steps div { display:flex; align-items:center; gap:10px; font-size:17px; color:#9AA1AE; transition:color .2s; }
  .steps div i { width:28px; height:28px; border-radius:50%; border:2px solid #C9CFD8; display:flex; align-items:center; justify-content:center; color:transparent; }
  .steps div.on { color:var(--ink); font-weight:700; }
  .steps div.on i { background:var(--teal); border-color:var(--ink); color:#fff; }
  /* result */
  .rhead { position:relative; background:var(--mint); border:2px solid var(--ink); border-radius:22px; padding:16px; margin:0 0 16px; overflow:hidden; }
  .rhead .k { font-family:var(--disp); font-size:18px; color:#0A5F5B; }
  .rrow { display:flex; align-items:center; gap:14px; margin:8px 0 10px; }
  .ring { position:relative; width:96px; height:96px; flex-shrink:0; }
  .ring svg { transform:rotate(-90deg); }
  .ring b { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--disp); font-size:32px; line-height:1; }
  .ring b small { font-family:"Noto Sans KR",sans-serif; font-size:13px; font-weight:700; color:var(--mut); margin-top:4px; }
  .rtype { display:inline-block; font-size:14px; font-weight:800; background:var(--coral-l); color:#9A3219; border:2px solid var(--ink); border-radius:999px; padding:3px 10px; margin:0 0 6px; }
  .rtitle { font-size:22px; line-height:1.38; margin:0; }
  .alt { display:flex; justify-content:space-between; font-size:14px; color:var(--mut); border-top:2px dashed #9FD9D4; padding-top:10px; margin-top:4px; }
  .why { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .why span { font-size:13px; font-weight:700; background:#fff; border:2px solid var(--ink); border-radius:8px; padding:3px 8px; }
  .card { border:2px solid var(--ink); border-radius:20px; background:#fff; margin:0 0 14px; overflow:hidden; box-shadow:4px 4px 0 var(--ink); }
  .card .h { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:2px solid var(--ink); font-family:var(--disp); font-size:19px; }
  .card .h .ib { width:36px; height:36px; border-radius:11px; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; background:#fff; }
  .card .h span.r { margin-left:auto; font-family:"Noto Sans KR",sans-serif; font-size:13px; font-weight:700; }
  .card .b { padding:14px; }
  .h.stu { background:var(--pur-l); } .h.gov { background:var(--mint); }
  .avatars { display:flex; gap:8px; margin:0 0 12px; flex-wrap:wrap; }
  .av { display:flex; align-items:center; gap:6px; border:2px solid var(--ink); border-radius:999px; padding:4px 10px 4px 4px; font-size:14px; font-weight:700; background:#fff; }
  .av i { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-style:normal; font-size:13px; font-weight:800; border:2px solid var(--ink); }
  .todo { display:flex; flex-direction:column; gap:8px; }
  .todo div { display:flex; gap:10px; align-items:flex-start; font-size:15px; line-height:1.5; }
  .todo div .ic { color:var(--pur); margin-top:1px; }
  .cost { display:flex; flex-direction:column; gap:2px; font-size:14px; color:var(--mut); border-top:2px dashed var(--line); padding-top:10px; margin-top:12px; } .cost b { color:var(--ink); font-size:15px; }
  .ag { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:8px 0; }
  .ag + .ag { border-top:2px dashed var(--line); }
  .ag b { display:block; font-size:16px; } .ag small { font-size:14px; color:var(--mut); }
  .pend { font-size:13px; font-weight:700; color:var(--mut); border:2px dashed #9AA1AE; border-radius:999px; padding:2px 8px; white-space:nowrap; }
  .human { display:flex; gap:10px; align-items:center; font-size:14px; line-height:1.5; background:var(--soft); border-radius:14px; padding:12px; color:#3A3F4B; }
  .badge { display:inline-block; font-size:13px; font-weight:700; color:var(--mut); margin:0 0 10px; }
  /* done */
  .done { position:fixed; inset:0; z-index:20; background:var(--teal); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; overflow:hidden; }
  .done .spk { position:absolute; color:var(--yel); }
  .done h2 { font-size:40px; line-height:1.25; margin:12px 0 10px; }
  .done p { font-size:18px; line-height:1.6; margin:0 0 26px; color:#FFFFFF; }
  .done .arrow { width:62px; height:62px; border-radius:50%; background:var(--yel); color:var(--ink); border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; margin:0 auto 6px; animation:up 1s ease-in-out infinite; }
  @keyframes up { 50% { transform:translateY(-8px); } }
  .done .row { display:flex; flex-direction:column; gap:12px; width:100%; max-width:360px; }
  .done .link { appearance:none; background:none; border:0; color:#fff; text-decoration:underline; font-size:16px; min-height:44px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header class="top"><span class="brand" id="brand"></span><span class="tag">시연용 · 가칭</span></header>
<main id="app"></main>
<div class="dock" id="dock" hidden></div>
<script>
/* 세종 로컬 해결소 시연 — 공통 데이터와 규칙 기반 분류기 (모든 시안이 같이 씀) */
(function () {
  var TYPES = {
    promo:    { label: '홍보·온라인 노출', kw: ['인스타', '홍보', 'sns', '리뷰', '지도', '검색', '노출', '새 손님', '블로그'], majors: ['경영·사회', '디자인·예체능'], tasks: ['지도 앱 가게 정보(사진·메뉴·영업시간) 정리', '인스타 게시물 3개 시안과 올리는 법 안내'], title: '온라인에서 가게가 잘 안 보여 새 손님이 줄고 있어요' },
    visual:   { label: '매장 사진·디자인', kw: ['사진', '간판', '메뉴판', '인테리어', '영상', '포스터', '디자인'], majors: ['디자인·예체능'], tasks: ['대표 메뉴 사진 다시 찍기', '메뉴판 다시 짜기'], title: '가게의 첫인상인 사진과 메뉴판을 다듬을 때예요' },
    price:    { label: '메뉴·가격', kw: ['가격', '메뉴', '단가', '원가', '할인', '올려'], majors: ['경영·사회'], tasks: ['원가와 가격표 점검', '손님 10명에게 가격 설문'], title: '가격과 메뉴 구성을 숫자로 점검할 때예요' },
    ops:      { label: '운영·재고', kw: ['재고', '발주', '인력', '바빠', '밀려', '일이 너무'], majors: ['경영·사회', 'IT·이공'], tasks: ['하루 업무 흐름 기록과 병목 찾기', '재고표 자동화'], title: '일이 몰리는 지점을 찾아 덜어 낼 때예요' },
    digital:  { label: '예약·주문 디지털화', kw: ['예약', '전화', '주문', '홈페이지', '키오스크'], majors: ['IT·이공'], tasks: ['온라인 예약 페이지 만들기', '자주 묻는 질문 자동 답변'], title: '전화로 받던 예약을 온라인으로 옮길 때예요' },
    customer: { label: '고객·상권 분석', kw: ['손님', '단골', '상권', '유동', '경쟁', '매출'], majors: ['경영·사회'], tasks: ['손님 20명 짧은 설문', '주변 상권과 비교'], title: '손님이 왜 줄었는지부터 확인할 때예요' },
    money:    { label: '자금·세무·제도', kw: ['임대료', '세금', '대출', '지원금', '자금', '세무', '돈'], majors: [], tasks: [], title: '자금·세무는 전문 기관 연결이 먼저예요', agency: true }
  };
  var SYMPTOM_MAP = {
    '새 손님이 안 와요': ['promo', 'customer'],
    '단골이 줄었어요': ['customer', 'price'],
    '일이 너무 많아요': ['ops', 'digital'],
    '돈 관리가 어려워요': ['money', 'price']
  };

  function classify(input) {
    var scores = {}, hits = {};
    Object.keys(TYPES).forEach(function (id) { scores[id] = 0; hits[id] = []; });
    if (input.state === 'unknown' && input.symptom) {
      var pair = SYMPTOM_MAP[input.symptom] || ['customer', 'promo'];
      scores[pair[0]] = 78; scores[pair[1]] = 52;
      hits[pair[0]] = ['진단 답: ' + input.symptom]; hits[pair[1]] = ['진단 답: ' + input.symptom];
    } else {
      var text = String(input.text || '').toLowerCase();
      Object.keys(TYPES).forEach(function (id) {
        TYPES[id].kw.forEach(function (k) { if (text.indexOf(k) !== -1) hits[id].push(k); });
        if (hits[id].length) scores[id] = Math.min(95, 46 + 18 * hits[id].length);
      });
    }
    var ranked = Object.keys(TYPES).sort(function (a, b) { return scores[b] - scores[a]; });
    if (!scores[ranked[0]]) { scores.customer = 60; hits.customer = ['단서가 적어 진단부터 시작']; ranked = ['customer'].concat(ranked.filter(function (x) { return x !== 'customer'; })); }
    var top = ranked.slice(0, 2).filter(function (id) { return scores[id] > 0; }).map(function (id) {
      return { id: id, label: TYPES[id].label, score: scores[id], hits: hits[id] };
    });
    var needsAgency = top.some(function (t) { return TYPES[t.id].agency; }) || input.supportUnknown === true;
    var majors = [];
    top.forEach(function (t) { TYPES[t.id].majors.forEach(function (m) { if (majors.indexOf(m) === -1) majors.push(m); }); });
    if (majors.length === 1) majors.push(majors[0] === '경영·사회' ? '디자인·예체능' : '경영·사회');
    var tasks = [];
    top.forEach(function (t) { TYPES[t.id].tasks.forEach(function (x) { if (tasks.length < 3 && tasks.indexOf(x) === -1) tasks.push(x); }); });
    var agencies = [];
    if (needsAgency) agencies.push({ name: '소상공인 지원기관', what: '정책자금·세무 상담으로 연결' });
    if (top.some(function (t) { return t.id === 'promo' || t.id === 'visual' || t.id === 'digital'; })) agencies.push({ name: '소상공인 지원기관', what: '온라인 판로·디지털 교육 안내' });
    agencies.push({ name: '청년 지원기관', what: '참여 학생 활동 확인서 발급' });
    var why = [];
    top.forEach(function (t) { t.hits.forEach(function (h) { if (why.indexOf(h) === -1) why.push(h); }); });
    return {
      title: TYPES[top[0].id].title,
      top: top,
      majors: majors,
      teamSize: Math.max(2, Math.min(4, majors.length + 1)),
      weeks: majors.length ? 3 : 0,
      tasks: tasks,
      agencies: agencies,
      needsAgency: needsAgency,
      why: why
    };
  }

  window.CORE = {
    INDUSTRIES: ['카페·디저트', '음식점', '소매', '서비스(미용·학원 등)', '기타'],
    AREAS: ['조치원읍', '신도심', '면 지역'],
    STATES: [
      { id: 'know', label: '해결책을 알아요', hint: '하고 싶은 일이 정해져 있어요' },
      { id: 'direction', label: '방향만 있어요', hint: '대충 어떤 문제인지는 알아요' },
      { id: 'unknown', label: '뭐가 필요한지 모르겠어요', hint: '질문 하나로 같이 찾아봐요' }
    ],

      var ov = document.createElement('div'); ov.className = 'done'; ov.setAttribute('role', 'status');
      ov.innerHTML = '<span class="spk" style="left:24px;top:60px">' + A.icon('spark', 30) + '</span><span class="spk" style="right:30px;top:120px;color:#fff">' + A.icon('spark', 20) + '</span><span class="spk" style="left:40px;bottom:140px;color:#BFE7E3">' + A.icon('spark', 24) + '</span>' +
        '<span class="arrow">' + A.icon('up', 30) + '</span>' + A.gomi('wow', 150) + '<h2 class="disp">앞 화면을 보세요!</h2><p>방금 올린 고민이<br>발표 화면 대시보드에 더해졌어요</p>' +
        '<div class="row"><button class="btn white" id="again">처음부터 다시 ' + A.icon('left', 20) + '</button><button class="link" id="close">결과 다시 보기</button></div>';
      document.body.appendChild(ov);
      document.getElementById('again').onclick = function () { set({ screen: 'landing', industry: null, area: null, state: null, symptom: null, text: '', result: null, err: false }); window.scrollTo(0, 0); };
      document.getElementById('close').onclick = function () { set({ screen: 'result' }); };
    }
  }
}
function alertBox() {
  var ov = document.createElement('div'); ov.className = 'done'; ov.style.background = '#6A4DE8'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', '운영 방식');
  ov.innerHTML = A.gomi('happy', 110) + '<h2 class="disp" style="font-size:30px">이렇게 운영돼요</h2><p style="text-align:left;max-width:340px">1. 사장님이 고민을 올려요<br>2. 학생 팀이 과제를 골라 지원해요<br>3. 가게를 찾아가 진단하고 결과물을 적용해요<br>4. 자금·세무는 공공기관으로 연결해요<br>5. 학생은 활동 인증과 포트폴리오를 받아요</p><div class="row"><button class="btn white" id="x">닫기</button></div>';
  document.body.appendChild(ov); document.getElementById('x').onclick = function () { ov.remove(); };
}
function save() {
  try { var r = S.result, k = 'sls_submissions', list = JSON.parse(localStorage.getItem(k) || '[]'); list.push({ ts: Date.now(), industry: S.industry, area: S.area, state: S.state, type: r.top[0].id, needsAgency: r.needsAgency }); localStorage.setItem(k, JSON.stringify(list)); } catch (e) {}
}
function analyze() {
  set({ screen: 'analyzing' }); window.scrollTo(0, 0);
  var lines = document.querySelectorAll('#st div'), i = 0;
  var t = setInterval(function () { if (i < lines.length) { lines[i].classList.add('on'); i++; return; } clearInterval(t); set({ screen: 'result', result: C.classify({ state: S.state, text: S.text, symptom: S.symptom }) }); }, 360);
}
render();
</script>
